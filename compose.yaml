services:
  github-stats:
    build:
      context: .
      dockerfile: Dockerfile
    image: github-stats:local
    container_name: github-stats

    env_file:
      - .env
    environment:
      HTTP_ADDRESS: ":9000"
      GOOGLE_APPLICATION_CREDENTIALS: "/var/run/secrets/google/adc.json"

    ports:
      - "9000:9000"

    volumes:
      - "${HOME}/.config/gcloud/application_default_credentials.json:/var/run/secrets/google/adc.json:ro"

    restart: unless-stopped

    read_only: true

    cap_drop:
        - ALL

    security_opt:
        - no-new-privileges:true
