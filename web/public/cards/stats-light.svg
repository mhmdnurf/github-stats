<svg
        xmlns="http://www.w3.org/2000/svg"
        width="495"
        height="240"
        viewBox="0 0 495 240"
        role="img"
        aria-label="GitHub statistics: rank A+, 128 stars, 1200 commits"
>
    <title>GitHub statistics</title>

    <style>
        text {
        font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Ubuntu, sans-serif;
        }
        .header { font-size: 18px; font-weight: 600; }
        .sub { font-size: 11.5px; font-weight: 400; }
        .label {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 1.2px;
        }
        .value {
        font-size: 22px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        }
        .rank { font-size: 16px; font-weight: 700; }

        @keyframes fadeUp {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
        }
        @keyframes ringFill {
        from { stroke-dashoffset: 169.65; }
        }
        @keyframes sparkDraw {
        from { stroke-dashoffset: 252.0; }
        to { stroke-dashoffset: 0; }
        }

        .stat {
        opacity: 0;
        animation: fadeUp 0.5s ease-out forwards;
        }
        .stat-0 {
        animation-delay: 0.00s;
        }
        .stat-1 {
        animation-delay: 0.08s;
        }
        .stat-2 {
        animation-delay: 0.16s;
        }
        .stat-3 {
        animation-delay: 0.24s;
        }
        .stat-4 {
        animation-delay: 0.32s;
        }
        .stat-5 {
        animation-delay: 0.40s;
        }
        .stat-6 {
        animation-delay: 0.48s;
        }
        
        .ring-progress {
        animation: ringFill 0.9s ease-out forwards;
        }
        .spark-line {
        animation: sparkDraw 1s ease-out 0.55s both;
        }

        @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .stat { opacity: 1; }
        }
    </style>

    <rect
            x="0.5"
            y="0.5"
            width="494"
            height="239"
            rx="10"
            fill="#ffffff"
            stroke="#d0d7de"
    />

    <g class="stat stat-0">
        <text x="28" y="40" class="header" fill="#1f2328">GitHub</text>
        <text x="28" y="60" class="sub" fill="#656d76">@octocat · last 12 months</text>
    </g>

    <g class="stat stat-1">
        <circle
                cx="437"
                cy="52"
                r="27"
                fill="none"
                stroke="#eaeef2"
                stroke-width="5"
        />
        <circle
                class="ring-progress"
                cx="437"
                cy="52"
                r="27"
                fill="none"
                stroke="#0969da"
                stroke-width="5"
                stroke-linecap="round"
                stroke-dasharray="169.65"
                stroke-dashoffset="12.72"
                transform="rotate(-90 437 52)"
        />
        <text
                x="437"
                y="57.5"
                class="rank"
                fill="#0969da"
                text-anchor="middle"
        >A+</text>
    </g>

    <g class="stat stat-2">
    <g transform="translate(28, 94)">
        <path fill="#0969da" transform="scale(0.72)" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/>
    </g>
    <text x="46" y="104" class="label" fill="#656d76">STARS</text>
    <text x="28" y="130" class="value" fill="#1f2328">128</text>
</g>
    <g class="stat stat-3">
    <g transform="translate(190, 94)">
        <path fill="#0969da" transform="scale(0.72)" d="M11.93 8.5a4.002 4.002 0 0 1-7.86 0H.75a.75.75 0 0 1 0-1.5h3.32a4.002 4.002 0 0 1 7.86 0h3.32a.75.75 0 0 1 0 1.5Zm-1.43-.75a2.5 2.5 0 1 0-5 0 2.5 2.5 0 0 0 5 0Z"/>
    </g>
    <text x="208" y="104" class="label" fill="#656d76">COMMITS</text>
    <text x="190" y="130" class="value" fill="#1f2328">1.2k</text>
</g>
    <g class="stat stat-4">
    <g transform="translate(352, 94)">
        <path fill="#0969da" transform="scale(0.72)" d="M1.5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm5.677-.177L9.573.677A.25.25 0 0 1 10 .854V2.5h1A2.5 2.5 0 0 1 13.5 5v5.628a2.251 2.251 0 1 1-1.5 0V5a1 1 0 0 0-1-1h-1v1.646a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354ZM3.75 2.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm0 9.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm8.25.75a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Z"/>
    </g>
    <text x="370" y="104" class="label" fill="#656d76">PULL REQUESTS</text>
    <text x="352" y="130" class="value" fill="#1f2328">340</text>
</g>
    <g class="stat stat-5">
    <g transform="translate(28, 154)">
        <path fill="#0969da" transform="scale(0.72)" d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/>
    </g>
    <text x="46" y="164" class="label" fill="#656d76">REPOSITORIES</text>
    <text x="28" y="190" class="value" fill="#1f2328">42</text>
</g>
    <g class="stat stat-6">
    <g transform="translate(190, 154)">
        <path fill="#0969da" transform="scale(0.72)" d="M2 5.5a3.5 3.5 0 1 1 5.898 2.549 5.508 5.508 0 0 1 3.034 4.084.75.75 0 1 1-1.482.235 4 4 0 0 0-7.9 0 .75.75 0 0 1-1.482-.236A5.507 5.507 0 0 1 3.102 8.05 3.493 3.493 0 0 1 2 5.5ZM11 4a3.001 3.001 0 0 1 2.22 5.018 5.01 5.01 0 0 1 2.56 3.012.749.749 0 0 1-.885.954.752.752 0 0 1-.549-.514 3.507 3.507 0 0 0-2.522-2.372.75.75 0 0 1-.574-.73v-.352a.75.75 0 0 1 .416-.672A1.5 1.5 0 0 0 11 5.5.75.75 0 0 1 11 4Zm-5.5-.5a2 2 0 1 0-.001 3.999A2 2 0 0 0 5.5 3.5Z"/>
    </g>
    <text x="208" y="164" class="label" fill="#656d76">FOLLOWERS</text>
    <text x="190" y="190" class="value" fill="#1f2328">890</text>
</g>
    

    <g class="stat stat-6">
    <text x="352" y="164" class="label" fill="#656d76">ACTIVITY</text>
    <polyline
            class="spark-line"
            points="352.0,194.3 354.2,189.9 356.4,187.5 358.6,186.0 360.8,172.7 363.1,187.1 365.3,172.0 367.5,176.8 369.7,189.7 371.9,174.4 374.1,185.1 376.3,190.3 378.5,188.8 380.8,193.4 383.0,194.0 385.2,193.6 387.4,194.5 389.6,194.3 391.8,194.9 394.0,195.8 396.2,192.7 398.4,189.2 400.7,191.9 402.9,188.8 405.1,192.9 407.3,192.3 409.5,188.1 411.7,188.6 413.9,191.4 416.1,192.3 418.3,189.9 420.6,192.7 422.8,191.6 425.0,193.8 427.2,192.9 429.4,190.3 431.6,194.5 433.8,192.3 436.0,191.2 438.2,191.4 440.5,191.6 442.7,191.4 444.9,188.1 447.1,195.3 449.3,192.1 451.5,189.7 453.7,192.7 455.9,191.9 458.2,188.4 460.4,186.8 462.6,188.8 464.8,178.8 467.0,188.8"
            fill="none"
            stroke="#0969da"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-dasharray="252.0"
    />
</g>
</svg>
