name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: mhmdnurf-github-stats
      REGION: asia-southeast2
      SERVICE_NAME: github-stats
      GITHUB_USERNAME: ${{ vars.GH_USERNAME }}
      DEPLOY_MODE: application

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Debug identity
        run: |
          gcloud auth list
          gcloud config list

      - name: Debug builds submit
        run: |
          gcloud builds submit . \
            --project="${PROJECT_ID}" \
            --tag="${REGION}-docker.pkg.dev/${PROJECT_ID}/github-stats/github-stats:ci-debug" \
            --gcs-source-staging-dir="gs://${PROJECT_ID}-${SERVICE_NAME}-cloudbuild/source" \
            --verbosity=debug 2>&1 | tail -n 100

      - name: Deploy
        run: ./scripts/deploy.sh
